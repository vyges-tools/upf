# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# 🔴 PUSH-TRIGGERED ON PURPOSE. Our release tooling derives the set of gating workflows from each
# repo's own `on:` triggers and requires every one green at HEAD, so a repo with no push-triggered
# workflow is reported as "not gated" — which reads like a pass and is actually "nobody looked".
#
# Two jobs, because the crate has two faces:
#   - `lib`: no default features, no C++ — the writer is a pure function of the intent.
#   - `engine`: `vyges-upf`, which reads the design database through vyges-opendb, which statically
#     links libodb (C++, built from source).
#
# ⚠️ Every `[patch]` path in Cargo.toml must resolve, even for features that are off: a missing
# path is a hard `failed to load source`. Hence the sibling checkouts in both jobs.
#
# Actions are enabled on this repository when it is made public.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lib:
    name: library (no C++)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-upf
    steps:
      - uses: actions/checkout@v7
        with:
          path: vyges-tools-upf
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/sta
          path: vyges-tools-sta
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --no-default-features --lib --verbose

  engine:
    name: engine (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-upf
    steps:
      - uses: actions/checkout@v7
        with:
          path: vyges-tools-upf
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/sta
          path: vyges-tools-sta

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      # No --locked: Cargo.lock is gitignored, and the [patch] resolves the sibling crates to the
      # freshly checked-out repos @ main — let Cargo resolve.
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --release --verbose
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Smoke the contract
        run: |
          ./target/release/vyges-upf --version
          ./target/release/vyges-upf --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="upf" and len(d["openroad_pin"])==40, d'
